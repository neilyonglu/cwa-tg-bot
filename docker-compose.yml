services:
  db:
    image: cwa-tg-db
    container_name: cwa-tg-db
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cwa
      POSTGRES_DB: cwa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未設定}
      TZ: Asia/Taipei
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cwa -d cwa"]
      interval: 5s
      retries: 10

  bot:
    image: cwa-tg-bot
    container_name: cwa-tg-bot
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cwa:${POSTGRES_PASSWORD}@db:5432/cwa
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '10000'), timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
